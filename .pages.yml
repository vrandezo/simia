
media:
  - name: images
    label: Images
    input: static/images
    output: /images
    categories: [image]
    rename: safe

content:
  - name: posts
    label: Blog posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    subfolders: true

    filename:
      template: "{year}-{month}-{day}-{slug}.md"
      field: create

    view:
      primary: title
      fields: [title, date, language]
      sort: [date]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Publication date
        type: date
        required: true
        options:
          format: "yyyy-MM-dd"

      - name: slug
        label: URL slug
        type: string
        required: true

      - name: language
        label: Language
        type: string

      - name: aliases
        label: Redirect aliases
        type: string
        list: true

      - name: tags
        label: Tags
        type: string
        list: true

      - name: summary
        label: Summary
        type: text

      - name: body
        label: Post content
        type: rich-text
        options:
          format: markdown
          media: images
          switcher: true

  - name: pages
    label: Static pages
    type: collection
    path: content/pages
    format: yaml-frontmatter
    subfolders: true

    view:
      primary: title
      fields: [title, language]
      sort: [title]

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: URL slug
        type: string

      - name: language
        label: Language
        type: string

      - name: topics
        label: Topics
        type: string
        list: true

      - name: body
        label: Page content
        type: rich-text
        options:
          format: markdown
          media: images
          switcher: true

settings:
  content:
    merge: true

